[project]
name = "whoop-mcp"
version = "0.1.0"
description = "WHOOP API v2 MCP server + Watermelon UI dashboard for triathlon coaching"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.1.3",
    "httpx>=0.28.1",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "respx>=0.23.1", "ruff"]

[project.scripts]
whoop-mcp = "whoop_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whoop_mcp"]
artifacts = ["src/whoop_mcp/static/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# dense one-liners and long lines are this codebase's style
ignore = ["E501", "E702", "E741", "E731", "B905"]
