[project]
name = "whoop-mcp"
version = "0.1.0"
description = "WHOOP API v2 MCP server + Watermelon UI dashboard for triathlon coaching"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.10",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[project.scripts]
whoop-mcp = "whoop_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whoop_mcp"]
artifacts = ["src/whoop_mcp/static/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
